name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm test

      - name: Build (core + insights + reporter + web + app)
        run: pnpm run build

      - name: Pack release tarballs (registry-free install)
        run: node scripts/pack-release.mjs

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; skipping creation."
          else
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
          fi

      - name: Upload tarballs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release/*.tgz --clobber

      # npm publish only when NPM_TOKEN is configured (npmjs publishing is
      # currently unavailable); the release tarballs cover installation meanwhile.
      # Prerelease tags (v0.0.2-beta, v1.0.0-rc.1...) publish under the npm
      # dist-tag "beta" so "latest" stays clean.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not configured; skipping npm publish (tarballs on the release cover install)."
            exit 0
          fi
          TAG_ARGS=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then TAG_ARGS="--tag beta"; fi
          for pkg in how-much-did-u-waste-core how-much-did-u-waste-insights how-much-did-u-waste-report; do
            pnpm --filter "$pkg" publish --access public $TAG_ARGS --no-git-checks
          done
          pnpm publish --access public $TAG_ARGS --no-git-checks
