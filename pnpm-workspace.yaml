allowBuilds:
  better-sqlite3: true
  esbuild: true
overrides:
  fast-uri: ">=4.1.2"
  nanoid@<3.3.18: ">=3.3.18"
minimumReleaseAgeExclude:
  - fastify@5.12.0
# pnpm 11 movió estos settings desde package.json. No es un monorepo; el archivo
# solo permite el build de esbuild (que Vite necesita), bloqueado por defecto.
onlyBuiltDependencies:
  - esbuild
